<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
  </head>
  <body>
    <a-scene 
      mindar-image="imageTargetSrc: ./target.mind;" 
      color-space="sRGB" 
      renderer="colorManagement: true" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <a-asset-item id="modelNaga" src="./naga.glb"></a-asset-item>
      </a-assets>

      <a-light type="ambient" intensity="1.5"></a-light>

      <!-- KAMERA (Elemen wajib agar tidak stuck/loading terus) -->
      <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-gltf-model 
          id="naga" 
          src="#modelNaga" 
          position="0 0 0" 
          scale="0.05 0.05 0.05"
          animation-mixer
          animation="property: position; to: 0 0.2 0; dir: alternate; loop: true; dur: 1200">
        </a-gltf-model>
      </a-entity>
    </a-scene>

    <script>
      const naga = document.querySelector('#naga');
      naga.addEventListener('click', () => {
        alert('Naga Ender Dragon disentuh!');
      });
    </script>
  </body>
</html>
